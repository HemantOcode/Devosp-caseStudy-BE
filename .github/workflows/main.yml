name: Backend Monorepo CI

on:
  push:
    branches: [ main ]
    paths:
      - "user-service/**"
      - "order-service/**"
      - "api-gateway/**"
      - "common/**"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - id: changed
        uses: tj-actions/changed-files@v44
        with:
          dir_names: true
          dir_names_max_depth: 1

      - id: set-matrix
        run: |
          # Detect changed services, ensuring we only include folders containing 'service' or 'gateway'
          SERVICES=$(echo '${{ steps.changed.outputs.all_changed_files }}' | tr ' ' '\n' | grep -E 'service|gateway' | jq -R . | jq -cs .)
          echo "matrix=$SERVICES" >> $GITHUB_OUTPUT

  build-test-push:
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    
    # Required for the AWS Credentials action to interact with GitHub OIDC if using that, 
    # otherwise standard secrets work.
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # 1. Configure AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your region

      # 2. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Docker Build & Push to ECR
      - name: Docker Build & Push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Note: The repository name in ECR must already exist (e.g., 'user-service')
          docker build -t $ECR_REGISTRY/${{ matrix.service }}:latest \
                       -t $ECR_REGISTRY/${{ matrix.service }}:${{ github.sha }} \
                       -f ./${{ matrix.service }}/Dockerfile .
          
          docker push $ECR_REGISTRY/${{ matrix.service }} --all-tags

name: Backend Monorepo CI

on:
  push:
    branches: [ main ]
    paths:
      - "user-service/**"
      - "order-service/**"
      - "api-gateway/**"
      - "common/**"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - id: changed
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            services:
              - user-service/**
              - order-service/**
              - api-gateway/**
            common:
              - common/**

      - id: set-matrix
        run: |
          # If 'common' changes, build everything. Otherwise, build only changed services.
          if [ "${{ steps.changed.outputs.common_any_changed }}" == "true" ]; then
            echo "Common changed. Triggering all services."
            SERVICES='["user-service", "order-service", "api-gateway"]'
          else
            # Extract folder names, filter for services, and format as JSON array
            SERVICES=$(echo '${{ steps.changed.outputs.services_all_changed_files }}' | tr ' ' '\n' | cut -d/ -f1 | sort -u | grep -E 'service|gateway' | jq -R . | jq -cs .)
          fi
          
          echo "matrix=$SERVICES" >> $GITHUB_OUTPUT

  build-test-push:
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Build & Push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # THE FIX: 
          # 1. '-f ./${{ matrix.service }}/Dockerfile' tells Docker where the file is.
          # 2. The '.' at the end tells Docker the context is the ROOT (where pom.xml lives).
          docker build -t $ECR_REGISTRY/${{ matrix.service }}:latest \
                       -t $ECR_REGISTRY/${{ matrix.service }}:${{ github.sha }} \
                       -f ./${{ matrix.service }}/Dockerfile .
          
          docker push $ECR_REGISTRY/${{ matrix.service }} --all-tags

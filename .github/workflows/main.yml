name: Backend Monorepo CI

on:
  push:
    branches: [ main ]
    paths:
      - "user-service/**"
      - "order-service/**"
      - "api-gateway/**"
      - "common/**"
  # This enables manual triggering from the "Actions" tab
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        # We only run this step if it's NOT a manual trigger
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            services:
              - user-service/**
              - order-service/**
              - api-gateway/**
            common:
              - common/**

      - id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          
          # 1. Check if manual run
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run detected: Building all services."
            SERVICES='["user-service","order-service","api-gateway"]'
          
          # 2. Check if 'common' library changed
          elif [[ "${{ steps.changed.outputs.common_any_changed }}" == "true" ]]; then
            echo "Common library changed: Building all services."
            SERVICES='["user-service","order-service","api-gateway"]'
          
          # 3. Otherwise, build only changed services
          else
            SERVICES=$(echo '${{ steps.changed.outputs.services_all_changed_files }}' \
              | tr ' ' '\n' \
              | cut -d/ -f1 \
              | sort -u \
              | grep -E 'service|gateway' \
              | jq -R . | jq -cs .)
          fi

          echo "matrix=$SERVICES" >> "$GITHUB_OUTPUT"

  build-test-push:
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Public ECR
        env:
          AWS_REGION: us-east-1
        run: |
          aws ecr-public get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build & Push Docker Image
        run: |
          # Map matrix service to public repo
          case "${{ matrix.service }}" in
            "api-gateway") REPO="public.ecr.aws/l4d8u4j9/lg-ns/api-gateway" ;;
            "order-service") REPO="public.ecr.aws/l4d8u4j9/lg-ns/orders-service" ;;
            "user-service") REPO="public.ecr.aws/l4d8u4j9/lg-ns/users-services" ;;
            *) echo "Unknown service"; exit 1 ;;
          esac

          docker build \
            -f ./${{ matrix.service }}/Dockerfile \
            -t $REPO:latest \
            -t $REPO:${{ github.sha }} \
            .

          docker push $REPO --all-tags

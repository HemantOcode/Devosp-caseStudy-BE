server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # 1. REMOVE DUPLICATES: Downstream services often add their own CORS headers.
      # This ensures the browser only sees the Gateway's headers.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      
      routes:
        - id: user-service
          uri: http://users.lg-ns:8081
          predicates:
            - Path=/users/**
          filters:
            - RewritePath=/users/(?<segment>.*), /users/$\{segment}

        - id: order-service
          uri: http://orders.lg-ns:8082
          predicates:
            - Path=/orders/**
          filters:
            - RewritePath=/orders/(?<segment>.*), /orders/$\{segment}

      # 2. CORS CONFIG: Must use patterns if allowCredentials is true
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*" # Use patterns instead of allowedOrigins for '*'
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true # Required for sessions/cookies
            maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
